<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14241D">
<title>Créneaux — agenda de tournois</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --feutre:#14241D; --feutre2:#1B3127; --feutre3:#264534;
  --craie:#EFE9DA; --craie-dim:#93A697;
  --laiton:#C9A227; --laiton-clair:#E7CB6B;
  --conflit:#E2483D; --trajet:#7FA6B8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--feutre);color:var(--craie);
  font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
body{padding:max(18px,env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--laiton-clair);outline-offset:2px}

.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--craie-dim);margin-bottom:6px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;
  font-size:clamp(28px,7vw,44px);letter-spacing:-.03em;line-height:1;margin:0 0 18px}
h1 em{font-style:normal;color:var(--laiton)}

.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;
  border-bottom:1px solid var(--feutre3)}
.stat-v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600}
.stat-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--craie-dim)}
.stat.alerte .stat-v{color:var(--conflit)}

button{font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:600;
  border-radius:2px;cursor:pointer;padding:11px 16px;border:1px solid var(--feutre3);
  background:var(--feutre2);color:var(--craie);transition:background .15s}
button:hover{background:var(--feutre3)}
button.primaire{background:var(--laiton);color:var(--surAccent);border-color:var(--laiton)}
button.primaire:hover{background:var(--laiton-clair)}
button.discret{background:transparent;border-color:transparent;color:var(--craie-dim);padding:7px 9px}
button.discret:hover{color:var(--craie);background:var(--feutre2)}
button:disabled{opacity:.45;cursor:not-allowed}
.barre{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}

.jour{margin-bottom:30px}
.jour-t{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--craie-dim);margin-bottom:10px}
.piste{position:relative;height:34px;background:var(--feutre2);border:1px solid var(--feutre3);
  border-radius:2px;margin-bottom:14px;overflow:hidden}
.heure{position:absolute;top:0;bottom:0;width:1px;background:var(--feutre3)}
.heure span{position:absolute;top:2px;left:3px;font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--craie-dim)}
.seg{position:absolute;top:7px;height:20px;border-radius:1px;background:var(--laiton);
  display:flex;align-items:center;padding:0 6px;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--surAccent);font-weight:600;overflow:hidden;white-space:nowrap}
.seg.conflit{background:var(--conflit);color:#fff}
.seg.envisage{background:transparent;border:1px dashed var(--craie-dim);color:var(--craie-dim)}
.seg-trajet{position:absolute;top:13px;height:8px;
  background:repeating-linear-gradient(45deg,var(--trajet) 0 3px,transparent 3px 6px)}

.carte{display:flex;background:var(--feutre2);border:1px solid var(--feutre3);
  border-radius:2px;margin-bottom:10px}
.rail{width:4px;flex:none;background:var(--st-inscrit)}
.rail.envisage{background:repeating-linear-gradient(to bottom,
  var(--st-envisage) 0 6px,transparent 6px 11px)}
.carte.conflit{border-color:var(--conflit)}
.carte.conflit .rail{background:var(--conflit)}
.corps{padding:13px 15px;flex:1;min-width:0}
.l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tete{cursor:pointer;user-select:none;margin:-3px -4px;padding:3px 4px;border-radius:2px}
.tete:hover{background:var(--feutre3)}
.chev{color:var(--craie-dim);font-size:11px;line-height:1.6;flex:none}
.stt{display:inline-flex;gap:3px;margin-left:auto;align-self:center;flex:none}
.sp{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
  border:1px solid var(--feutre3);background:transparent;color:var(--craie-dim);
  line-height:1.3;white-space:nowrap}
.sp:hover{background:var(--feutre3);color:var(--craie)}
.sp.on{color:var(--surAccent)}
.sp[data-v="inscrit"].on{background:var(--st-inscrit);border-color:var(--st-inscrit)}
.sp[data-v="attente"].on{background:var(--st-attente);border-color:var(--st-attente)}
.sp[data-v="envisage"].on{background:transparent;color:var(--st-envisage);
  border:1px dashed var(--st-envisage);font-weight:600}
@media (max-width:480px){.stt{margin-left:0;width:100%;margin-top:6px}}
.pcfl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--conflit);color:#fff;padding:2px 6px;
  border-radius:2px;align-self:center}
.filtres{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid var(--feutre3)}
.fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl-t{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--craie-dim);margin-right:2px;flex:none}
.puce{font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;
  border:1px solid var(--feutre3);background:transparent;color:var(--craie-dim)}
.puce:hover{background:var(--feutre2);color:var(--craie)}
.puce.on{background:var(--laiton);border-color:var(--laiton);color:var(--surAccent);font-weight:600}
.creneau{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:var(--laiton-clair)}
.carte.conflit .creneau{color:var(--conflit)}
.nom{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px}
.boutique{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:13px;
  color:var(--laiton);margin-left:8px;letter-spacing:.01em}
.boutique::before{content:"· ";color:var(--feutre3)}
.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--craie-dim);
  margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.meta i{font-style:normal;color:var(--feutre3)}
.alerte{margin-top:9px;padding:7px 10px;background:rgba(226,72,61,.12);
  border-left:2px solid var(--conflit);font-size:12.5px;color:var(--alerteTexte)}
.actions{display:flex;gap:4px;margin-top:8px}
.imp-l{display:flex;align-items:flex-start;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--feutre3)}
.imp-l:last-child{border-bottom:none}
.imp-l.connu{opacity:.5}
.imp-l.suspect{background:rgba(226,72,61,.07);border-left:2px solid var(--conflit);
  padding-left:9px;margin-left:-9px}
.imp-w{display:block;margin-top:4px;color:var(--alerteTexte);font-size:11.5px;
  font-family:'Instrument Sans',sans-serif}
.imp-l input{margin-top:3px;flex:none}
.imp-n{min-width:0;font-size:13.5px}
.imp-d{color:var(--craie-dim);font-size:11.5px;font-family:'JetBrains Mono',monospace}
.imp-a{flex:none;font-size:11.5px;padding:4px 8px;align-self:flex-start;margin-top:1px}
.imp-b.exclu{background:transparent;border:1px dashed var(--craie-dim)}
.imp-b{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;flex:none;margin-top:2px;
  background:var(--feutre3);color:var(--craie-dim)}
textarea.colle{width:100%;background:var(--feutre);border:1px solid var(--feutre3);
  color:var(--craie);padding:11px;font-size:14px;border-radius:2px;resize:vertical;
  font-family:'JetBrains Mono',monospace;line-height:1.45}
.lien{font-size:13px;font-weight:600;color:var(--laiton);text-decoration:none;
  padding:7px 9px;border-radius:2px}
.lien:hover{background:var(--feutre2);text-decoration:underline}
.itin{margin-top:10px;padding-top:9px;border-top:1px solid var(--feutre3);
  display:flex;flex-direction:column;gap:7px}
.itin-t{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--craie-dim);margin-bottom:1px}
.et{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.35}
.badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;
  padding:3px 7px;border-radius:2px;background:var(--laiton);color:var(--surAccent);
  flex:none;min-width:30px;text-align:center;margin-top:1px}
.et.marche .badge{background:transparent;border:1px dashed var(--craie-dim);
  color:var(--craie-dim);font-weight:400}
.et-txt{min-width:0;word-break:break-word}
.et-dir{color:var(--craie-dim);font-size:11.5px}
.et-h{font-family:'JetBrains Mono',monospace;color:var(--laiton-clair);font-size:11px}

.form{background:var(--feutre2);border:1px solid var(--feutre3);padding:18px;
  margin-bottom:26px;border-radius:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:span 2}
.champ label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--craie-dim)}
.champ input,.champ select{background:var(--feutre);border:1px solid var(--feutre3);
  color:var(--craie);padding:10px;font-size:16px;font-family:'Instrument Sans',sans-serif;
  border-radius:2px;width:100%;min-width:0}
.champ input[type=number],.champ input[type=time],.champ input[type=date]{
  font-family:'JetBrains Mono',monospace}
.estim{margin-top:14px;padding:11px 13px;background:var(--feutre);
  border-left:2px solid var(--laiton);font-size:13px}
.estim b{font-family:'JetBrains Mono',monospace;color:var(--laiton-clair)}
.estim .prevu{color:var(--conflit);display:block;margin-top:6px}

.vide{border:1px dashed var(--feutre3);padding:34px 20px;text-align:center;
  color:var(--craie-dim);border-radius:2px}
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--craie-dim);
  margin-bottom:20px;font-family:'JetBrains Mono',monospace}
.legende span{display:flex;align-items:center;gap:6px}
.pastille{width:16px;height:8px;border-radius:1px;display:inline-block}

.trajets{background:var(--feutre2);border:1px solid var(--feutre3);padding:16px;
  margin-bottom:26px;border-radius:2px}
.tr-l{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--feutre3);flex-wrap:wrap}
.tr-l:last-of-type{border-bottom:none}
.tr-n{flex:1;font-size:13px;min-width:150px}
.tr-v{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--trajet)}
.tr-l input{width:80px;background:var(--feutre);border:1px solid var(--feutre3);
  color:var(--craie);padding:6px 8px;font-family:'JetBrains Mono',monospace;
  font-size:16px;border-radius:2px}
.note{font-size:11.5px;color:var(--craie-dim);margin-top:10px}

.pied{margin-top:40px;padding-top:18px;border-top:1px solid var(--feutre3);
  font-size:11.5px;color:var(--craie-dim);display:flex;gap:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>

<script>
"use strict";

/* ---------- référentiel ---------- */
const JEUX=["Palworld","Pokémon","Cyberpunk","One Piece","Riftbound","Altered","Flesh and Blood","Autre"];
const STATUTS={
  inscrit:{label:"Inscrit",court:"Inscrit",c:"var(--st-inscrit)"},
  attente:{label:"Liste d'attente",court:"Attente",c:"var(--st-attente)"},
  envisage:{label:"Envisagé",court:"Envisagé",c:"var(--st-envisage)"}};
/* du plus incertain au plus engageant : l'ordre de lecture suit la progression */
const ORDRE_STATUTS=["envisage","attente","inscrit"];
const CUTS={aucun:0,top4:2,top8:3,top16:4};
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS=["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

function rondesSuisses(n){n=Number(n);if(!n||n<2)return 3;if(n<=8)return 3;if(n<=16)return 4;
  if(n<=32)return 5;if(n<=64)return 6;if(n<=128)return 7;if(n<=226)return 8;if(n<=409)return 9;return 10}

/* Créneau ronde = temps de jeu + retournement (appel, pairings, report).
   Bo3 : 50 min de jeu + 10. Bo1 : 25 + 10. Top cut : plus long, souvent sans chrono. */
function estimerDuree(v){
  const rs=rondesSuisses(v.participants), rc=CUTS[v.cut]??0;
  const dr=v.bo==="bo3"?60:35, dc=v.bo==="bo3"?75:45;
  const t=30+(v.drafts?45:0)+rs*dr+(rc>0?30+rc*dc:0);
  return Math.round(t/5)*5;
}

/* ---------- temps ---------- */
const pad=n=>String(n).padStart(2,"0");
const minMinuit=s=>{if(!s)return null;const[h,m]=s.split(":").map(Number);return h*60+m};
function hhmm(m){const x=((m%1440)+1440)%1440;return pad(Math.floor(x/60))+":"+pad(x%60)}
function fdur(m){if(m==null)return"—";const h=Math.floor(m/60),r=m%60;
  return h===0?r+" min":(r===0?h+" h":h+" h "+pad(r))}
function horod(e){if(!e.date||!e.heure)return null;
  const[a,mo,j]=e.date.split("-").map(Number),[h,mi]=e.heure.split(":").map(Number);
  return new Date(a,mo-1,j,h,mi).getTime()}
function debutFin(e){const d=horod(e);if(d==null)return null;
  const du=e.dureeManuelle!=null?e.dureeManuelle:estimerDuree(e);
  return{debut:d,fin:d+du*60000,duree:du}}
function libJour(iso){const[a,m,j]=iso.split("-").map(Number);
  return JOURS[new Date(a,m-1,j).getDay()]+" "+j+" "+MOIS[m-1]}
const norm=s=>(s||"").trim().toLowerCase().replace(/\s+/g," ");
const cleTr=(a,b)=>{const p=[norm(a),norm(b)].sort();return p[0]+"→"+p[1]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- état ---------- */
const CLE="jcc.agenda.v1";
const REGLAGES_DEFAUT={base:"",margeDepart:15,alerteTrajet:30,mode:"transports",
  fournisseur:"prim",baseTC:"",jeuxSuivis:[],rayonKm:45,theme:"feutre"};

/* Fournisseurs d'itinéraires en transports. Tous exposent le moteur Navitia,
   donc la même requête et la même réponse : seuls l'adresse et le mode
   d'authentification changent. navitia.io, portail public historique, a fermé —
   d'où ce choix configurable plutôt qu'une adresse codée en dur. */
const FOURNISSEURS={
  prim:{nom:"Île-de-France Mobilités (PRIM)",
        base:"https://prim.iledefrance-mobilites.fr/marketplace/v2/navitia",
        auth:"apikey",
        aide:"Compte gratuit sur prim.iledefrance-mobilites.fr, rubrique « Mes jetons d\'authentification ». Couvre métro, RER, Transilien, bus et tram franciliens."},
  sncf:{nom:"API SNCF (ferroviaire national)",
        base:"https://api.sncf.com/v1/coverage/sncf",
        auth:"basic",
        aide:"Compte gratuit sur numerique.sncf.com/startup/api. Couvre les trains sur toute la France, mais pas les réseaux urbains de desserte."},
  perso:{nom:"Autre instance Navitia",
        base:"",auth:"apikey",
        aide:"Renseigne l\'adresse de base d\'une instance Navitia à laquelle tu as accès."}
};
let S={events:[],lieux:[],exclus:[],trajets:{},reglages:Object.assign({},REGLAGES_DEFAUT),
       reglagesMaj:0,supprimes:{},tc:{},notifs:[]};

/* Identifiants de synchronisation : stockés à part, JAMAIS inclus dans la charge
   envoyée au gist ni dans l'export. Un jeton ne doit pas voyager. */
const CLE_SYNC="jcc.sync.v1";
let sync={token:"",gistId:"",dernier:0,navitia:""};
let syncEtat=null;
function loadSync(){try{const r=localStorage.getItem(CLE_SYNC);
  if(r)sync=Object.assign(sync,JSON.parse(r))}catch(e){}}
function saveSync(){try{localStorage.setItem(CLE_SYNC,JSON.stringify(sync))}catch(e){}}
let voirPasses=false, ouverts={}, filtreJeu='', filtreLieu='';
let importListe=null, importSel={}, importTout=false;
let draft=null, lieuBrouillon=null, importTexte='', importRapport=null,
    importOuvert=false, formOuvert=false, panneau=false,
    reglagesOuvert=false, lieuxOuvert=false, occupe=false;

function load(){try{const r=localStorage.getItem(CLE);if(r){
  const d=JSON.parse(r);
  S={events:d.events||[],lieux:d.lieux||[],exclus:d.exclus||[],trajets:d.trajets||{},
     reglages:Object.assign({},REGLAGES_DEFAUT,d.reglages||{}),
     reglagesMaj:d.reglagesMaj||0,supprimes:d.supprimes||{},
     tc:d.tc||{},notifs:d.notifs||[]};
}}catch(e){}}
function save(){try{localStorage.setItem(CLE,JSON.stringify(S));return true}catch(e){return false}}


/* Deux fiches désignent-elles le même endroit ? On compare tous les noms
   connus de part et d'autre — lieu enregistré, boutique, organisateur, adresse.
   Melee affiche « Boutique Loufoque » en tête de groupe et « Belokan Corp »
   sous le tournoi : ne retenir qu'un seul des deux faisait échouer le
   rapprochement. */
function nomsLieu(ev){
  return [ev.lieuNom,ev.boutique,ev.organisateur,ev.lieu]
    .map(v=>norm(v||"")).filter(v=>v.length>=3);
}

function memeLieu(a,b){
  if(a.lieuId&&b.lieuId)return a.lieuId===b.lieuId;
  const na=nomsLieu(a), nb=nomsLieu(b);
  if(!na.length||!nb.length)return false;
  return na.some(x=>nb.some(y=>
    x===y||(x.length>=5&&y.length>=5&&(x.indexOf(y)>=0||y.indexOf(x)>=0))));
}

/* ---------- détection de doublons ---------- */
/* Même journée, même boutique, horaire voisin : c'est presque certainement le
   même tournoi saisi deux fois. On distingue l'identique (même heure) du
   probable (moins de 30 min d'écart), parce qu'une boutique peut légitimement
   enchaîner deux épreuves dans la journée. */
function doublons(ev){
  /* L'adresse de la fiche Melee est une identité certaine : elle tranche seule. */
  if(ev.url){
    const parUrl=(S.events||[]).filter(o=>
      o.url&&o.url===ev.url&&!(o.id&&ev.id&&o.id===ev.id));
    if(parUrl.length)return parUrl.map(o=>({ev:o,exact:true}));
  }
  if(!ev.date||!ev.heure)return [];
  const h=minMinuit(ev.heure);
  return (S.events||[]).filter(o=>{
    if(o.id&&ev.id&&o.id===ev.id)return false;
    if(o.date!==ev.date||!o.heure)return false;
    if(!memeLieu(ev,o))return false;
    return Math.abs(minMinuit(o.heure)-h)<=30;
  }).map(o=>({ev:o,exact:o.heure===ev.heure}));
}

function texteDoublons(ds){
  return ds.map(d=>(d.exact?"identique à":"très proche de")
    +" « "+(d.ev.nom||"sans nom")+" » ("+d.ev.heure+")").join(", ");
}


/* ---------- liste d'exclusion ---------- */
/* Un tournoi écarté volontairement ne doit plus jamais réclamer d'attention.
   Le rapprochement suit les mêmes critères que la détection de doublons —
   même jour, même boutique, horaire voisin — auxquels s'ajoute l'adresse de la
   fiche Melee quand elle est connue, qui vaut identité certaine. */
function signature(ev){
  return{date:ev.date||"",heure:ev.heure||"",
    lieu:norm(ev.lieuNom||ev.boutique||ev.organisateur||ev.lieu||""),
    noms:nomsLieu(ev),nom:ev.nom||"",url:ev.url||""};
}

function estExclu(ev){
  const s2=signature(ev);
  return (S.exclus||[]).find(x=>{
    if(s2.url&&x.url&&s2.url===x.url)return true;
    if(x.date!==s2.date)return false;
    const a=x.noms||(x.lieu?[x.lieu]:[]), b=s2.noms||[];
    if(a.length&&b.length&&!a.some(u=>b.some(v=>
      u===v||(u.length>=5&&v.length>=5&&(u.indexOf(v)>=0||v.indexOf(u)>=0)))))return false;
    if(!x.heure||!s2.heure)return x.nom===s2.nom;
    return Math.abs(minMinuit(x.heure)-minMinuit(s2.heure))<=30;
  })||null;
}

function exclure(ev){
  if(estExclu(ev))return;
  S.exclus.push(Object.assign({id:"x"+Date.now()+Math.floor(Math.random()*1000),
    maj:Date.now()},signature(ev)));
}

function reintegrer(id){
  const x=(S.exclus||[]).find(e=>e.id===id);
  if(!x)return;
  S.exclus=S.exclus.filter(e=>e.id!==id);
  S.supprimes[id]=Date.now();   /* pour que la levée se propage aux autres appareils */
}

/* ---------- lieux favoris ---------- */
function lieuParId(id){return (S.lieux||[]).find(l=>l.id===id)||null}

/* Nom affiché d'un tournoi : nom de l'épreuve suivi de la boutique. */
function nomComplet(ev){
  const n=ev.nom||"Sans nom";
  return ev.lieuNom?n+" — "+ev.lieuNom:n;
}

/* Quand l'adresse d'un lieu change, les tournois qui s'y rattachent suivent,
   et leurs itinéraires déjà calculés deviennent caducs. */
function propagerLieu(l){
  let touche=false;
  S.events.forEach(e=>{
    if(e.lieuId!==l.id)return;
    if(e.lieu!==l.adresse||e.lieuNom!==l.nom){
      e.lieu=l.adresse;e.lieuNom=l.nom;e.maj=Date.now();touche=true;
    }
  });
  return touche;
}

/* ---------- conflits ---------- */
function analyser(){
  const items=S.events.map(e=>{const d=debutFin(e);return d?Object.assign({ev:e},d):null})
    .filter(Boolean).sort((a,b)=>a.debut-b.debut);
  const conflits=new Map();
  const push=(id,c)=>{if(!conflits.has(id))conflits.set(id,[]);conflits.get(id).push(c)};
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
    const A=items[i],B=items[j];
    if(B.debut-A.fin>864e5)break;
    if(B.debut<A.fin){
      push(A.ev.id,{type:"chevauchement",avec:B.ev});
      push(B.ev.id,{type:"chevauchement",avec:A.ev});continue;
    }
    const ecart=Math.round((B.debut-A.fin)/60000);
    if(ecart>840)continue;
    if(norm(A.ev.lieu)===norm(B.ev.lieu))continue;
    const t=S.trajets[cleTr(A.ev.lieu,B.ev.lieu)];
    if(!t)continue;
    if(ecart<t.minutes){
      const d={ecart:ecart,besoin:t.minutes};
      push(A.ev.id,{type:"trajet",avec:B.ev,detail:d});
      push(B.ev.id,{type:"trajet",avec:A.ev,detail:d});
    }
  }
  return{items:items,conflits:conflits};
}

/* Origine du déplacement vers l'événement i : le tournoi précédent s'il est
   assez proche dans le temps, sinon l'adresse de départ habituelle. */
function origineDe(items,i){
  const cible=items[i];
  if(!cible.ev.lieu)return null;
  const prec=items[i-1];
  if(prec&&prec.ev.lieu&&cible.debut-prec.fin<=504e5)return prec.ev.lieu;
  const b=(S.reglages.base||"").trim();
  return b||null;
}

/* Toutes les paires de lieux dont l'outil a besoin d'un temps de trajet. */
function pairesRequises(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const de=origineDe(items,i);
    if(!de)continue;
    const vers=items[i].ev.lieu;
    if(norm(de)===norm(vers))continue;
    const k=cleTr(de,vers);
    if(!out.some(p=>p.cle===k))out.push({cle:k,de:de,vers:vers});
  }
  return out;
}

/* Temps de trajet connu pour rejoindre l'événement i, ou null. */
function trajetEntrant(items,i){
  const de=origineDe(items,i);
  if(!de)return null;
  const ev=items[i].ev, vers=ev.lieu;
  if(norm(de)===norm(vers))return null;
  if(S.reglages.mode==="transports"){
    const tc=S.tc[ev.id];
    /* on n'utilise le résultat que s'il correspond encore au lieu et à l'horaire */
    if(tc&&tc.empreinte===empreinteTC(de,vers,ev))
      return{minutes:tc.minutes,de:de,vers:vers,mode:"tc",
             correspondances:tc.correspondances,lignes:tc.lignes||[],
             etapes:tc.etapes||[],depart:tc.depart};
  }
  const t=S.trajets[cleTr(de,vers)];
  return t?{minutes:t.minutes,de:de,vers:vers,mode:"voiture"}:null;
}

/* ---------- géocodage + itinéraire (BAN + OSRM, sans clé) ---------- */
async function geocoder(q){
  const u="https://api-adresse.data.gouv.fr/search/?limit=1&q="+encodeURIComponent(q);
  const r=await fetch(u);
  if(!r.ok)throw new Error("géocodage indisponible");
  const d=await r.json();
  if(!d.features||!d.features.length)throw new Error("adresse introuvable : "+q);
  return d.features[0].geometry.coordinates; // [lon,lat]
}
async function itineraire(a,b){
  const u="https://router.project-osrm.org/route/v1/driving/"+a[0]+","+a[1]+";"+b[0]+","+b[1]+"?overview=false";
  const r=await fetch(u);
  if(!r.ok)throw new Error("calcul d'itinéraire indisponible");
  const d=await r.json();
  if(!d.routes||!d.routes.length)throw new Error("aucun itinéraire routier");
  return{minutes:Math.round(d.routes[0].duration/60),km:Math.round(d.routes[0].distance/1000)};
}
async function calculerTrajets(){
  const {items}=analyser();
  const paires=pairesRequises(items);
  occupe=true;render();
  const echecs=[];
  for(const p of paires){
    const ex=S.trajets[p.cle];
    if(ex&&ex.source==="manuel")continue;
    try{
      const[A,B]=await Promise.all([geocoder(p.de),geocoder(p.vers)]);
      const r=await itineraire(A,B);
      S.trajets[p.cle]={minutes:r.minutes,km:r.km,source:"auto"};
    }catch(e){echecs.push(p.de+" ↔ "+p.vers+" : "+e.message)}
  }
  occupe=false;save();render();
  if(echecs.length)alert("Trajets non calculés :\n\n"+echecs.join("\n")+
    "\n\nPrécise le lieu (rue, code postal, ville) ou saisis la durée à la main.");
}



/* ---------- itinéraires en transports en commun (Navitia) ---------- */
/* Contrairement à la voiture, un trajet en transports dépend du jour et de
   l'heure. On interroge donc par tournoi, en posant la question à l'envers :
   « à quelle heure partir pour arriver avant le début ? ». Le résultat est
   mémorisé avec une empreinte du contexte, et recalculé dès que le lieu,
   la date ou l'heure changent. */

function empreinteTC(de,vers,ev){
  return "v2|"+norm(de)+"|"+norm(vers)+"|"+ev.date+"|"+ev.heure;
}

function navitiaDate(ev,marge){
  const t=horod(ev)-marge*60000, d=new Date(t);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"
    +pad(d.getHours())+pad(d.getMinutes())+"00";
}

function fournisseurActif(){
  const f=FOURNISSEURS[S.reglages.fournisseur]||FOURNISSEURS.prim;
  const base=(S.reglages.fournisseur==="perso")
    ? (S.reglages.baseTC||"").replace(/\/+$/,"") : f.base;
  return{base:base,auth:f.auth,nom:f.nom};
}

async function navitiaTrajet(coordDe,coordVers,arriveeAvant){
  const f=fournisseurActif();
  if(!f.base)throw new Error("aucune adresse de service renseignée");
  const u=f.base+"/journeys"
    +"?from="+coordDe[0]+";"+coordDe[1]
    +"&to="+coordVers[0]+";"+coordVers[1]
    +"&datetime="+arriveeAvant
    +"&datetime_represents=arrival"
    +"&max_nb_journeys=1";
  const en={};
  if(f.auth==="basic")en["Authorization"]="Basic "+btoa(sync.navitia+":");
  else en["apikey"]=sync.navitia;

  let r;
  try{
    r=await fetch(u,{headers:en});
  }catch(e){
    /* fetch ne rejette que sur panne réseau ou blocage CORS : le distinguer
       évite de faire chercher une erreur de clé là où il n'y en a pas */
    throw new Error("appel bloqué par le navigateur (CORS) ou réseau indisponible — "
      +"le service refuse peut-être les requêtes venues d'une page web");
  }
  if(r.status===401||r.status===403)throw new Error("clé refusée par "+f.nom);
  if(r.status===404)throw new Error("aucune couverture pour ces lieux chez "+f.nom);
  if(r.status===429)throw new Error("quota journalier atteint");
  if(!r.ok)throw new Error(f.nom+" a répondu "+r.status);
  const d=await r.json();
  if(!d.journeys||!d.journeys.length)
    throw new Error("aucun itinéraire en transports trouvé");
  const j=d.journeys[0];

  /* On conserve le détail de chaque section : c'est lui qui permet d'afficher
     la ligne, la station de montée et la direction à suivre. */
  const etapes=(j.sections||[]).map(sec=>{
    const min=Math.round((sec.duration||0)/60);
    if(sec.type==="public_transport"){
      const di=sec.display_informations||{};
      return{t:"tc",min:min,
        code:di.code||di.commercial_mode||"?",
        mode:di.commercial_mode||"",
        couleur:di.color||"",
        encre:di.text_color||"",
        direction:di.direction||di.headsign||"",
        de:(sec.from&&sec.from.name)||"",
        vers:(sec.to&&sec.to.name)||"",
        depart:sec.departure_date_time||"",
        arrivee:sec.arrival_date_time||""};
    }
    if(sec.type==="street_network"||sec.type==="transfer"||sec.type==="crow_fly"){
      return min>=1?{t:"marche",min:min,vers:(sec.to&&sec.to.name)||""}:null;
    }
    if(sec.type==="waiting")return min>=2?{t:"attente",min:min}:null;
    return null;
  }).filter(Boolean);

  const lignes=etapes.filter(e=>e.t==="tc").map(e=>e.code);
  return{minutes:Math.round(j.duration/60),
         correspondances:j.nb_transfers,
         depart:j.departure_date_time,
         lignes:lignes,etapes:etapes};
}

async function calculerTC(){
  if(!sync.navitia){
    alert("Renseigne d'abord une clé Navitia dans le panneau Rappels.");return;
  }
  const {items}=analyser();
  occupe=true;render();
  const echecs=[];
  const marge=Number(S.reglages.margeDepart)||0;
  for(let i=0;i<items.length;i++){
    const x=items[i], de=origineDe(items,i), vers=x.ev.lieu;
    if(!de||norm(de)===norm(vers))continue;
    const emp=empreinteTC(de,vers,x.ev);
    const ex=S.tc[x.ev.id];
    if(ex&&ex.empreinte===emp&&ex.source==="manuel")continue;
    if(ex&&ex.empreinte===emp&&ex.source==="auto")continue;
    try{
      const[A,B]=await Promise.all([geocoder(de),geocoder(vers)]);
      const r=await navitiaTrajet(A,B,navitiaDate(x.ev,marge));
      S.tc[x.ev.id]=Object.assign({empreinte:emp,de:de,vers:vers,source:"auto"},r);
    }catch(e){echecs.push((x.ev.nom||"sans nom")+" : "+e.message)}
  }
  occupe=false;save();render();syncDifferee();
  if(echecs.length)alert("Trajets en transports non calculés :\n\n"+echecs.join("\n")
    +"\n\nPrécise les adresses, ou saisis la durée à la main.");
}

/* ---------- alarmes ---------- */
/* Deux rappels par tournoi :
   - "départ" : marge avant l'heure à laquelle il faut prendre la route ;
   - "trajet" : au moment où il faut effectivement partir (début - temps de trajet). */
function alarmes(){
  const {items}=analyser();
  const out=[];
  items.forEach((x,i)=>{
    const t=trajetEntrant(items,i);
    const marge=Number(S.reglages.margeDepart)||0;
    if(t){
      const depart=x.debut-(t.minutes+marge)*60000;
      const prem=(t.etapes||[]).find(e=>e.t==="tc");
      out.push({cle:x.ev.id+":trajet",quand:depart,type:"trajet",ev:x.ev,
        titre:"Départ pour "+(x.ev.nom||"ton tournoi"),
        texte:fdur(t.minutes)+" de trajet depuis "+t.de+". Début à "+
          hhmm(minMinuit(x.ev.heure))+"."
          +(prem?" Ligne "+prem.code+" à "+prem.de
            +(prem.direction?", direction "+prem.direction:"")+".":"")});
      const prevenir=depart-(Number(S.reglages.alerteTrajet)||0)*60000;
      out.push({cle:x.ev.id+":preavis",quand:prevenir,type:"preavis",ev:x.ev,
        titre:"Prépare-toi : "+(x.ev.nom||"tournoi"),
        texte:"Départ dans "+fdur(Number(S.reglages.alerteTrajet)||0)+
          " pour "+fdur(t.minutes)+" de trajet."});
    }else{
      out.push({cle:x.ev.id+":simple",quand:x.debut-60*60000,type:"simple",ev:x.ev,
        titre:(x.ev.nom||"Tournoi")+" dans 1 h",
        texte:(x.ev.lieu||"")+" — début à "+hhmm(minMinuit(x.ev.heure))+"."});
    }
  });
  return out.filter(a=>a.quand>0).sort((a,b)=>a.quand-b.quand);
}

/* Version texte compacte de l'itinéraire, pour l'agenda et les notifications. */
function itineraireTexte(t){
  if(!t||t.mode!=="tc"||!t.etapes||!t.etapes.length)return "";
  return t.etapes.map(e=>{
    if(e.t==="marche")return "A pied "+fdur(e.min)+(e.vers?" jusqu'a "+e.vers:"");
    if(e.t==="attente")return "Attente "+fdur(e.min);
    return e.code+" a "+e.de+(e.depart?" ("+heureNavitia(e.depart)+")":"")
      +(e.direction?" dir. "+e.direction:"")
      +(e.vers?", descendre a "+e.vers:"");
  }).join(" | ");
}

/* ---------- export iCalendar ---------- */
function icsEchap(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;")
  .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function icsPlier(l){
  const o=[];let r=l;
  while(r.length>73){o.push(r.slice(0,73));r=" "+r.slice(73)}
  o.push(r);return o.join("\r\n");
}
function icsDate(ms){
  const d=new Date(ms);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"
    +pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
}
function genererICS(){
  const {items,conflits}=analyser();
  const now=icsDate(Date.now());
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Creneaux//Agenda tournois//FR",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Tournois"];

  items.forEach((x,i)=>{
    const e=x.ev, t=trajetEntrant(items,i);
    const marge=Number(S.reglages.margeDepart)||0;
    const preavis=Number(S.reglages.alerteTrajet)||0;
    const enConflit=conflits.has(e.id);

    const desc=[e.jeu,e.format,(e.bo==="bo3"?"Bo3":"Bo1"),
      (e.participants?e.participants+" joueurs":""),
      (e.cut!=="aucun"?e.cut:""),(e.frais?e.frais+" EUR":""),
      (STATUTS[e.statut]||{}).label,
      (t?"Trajet: "+fdur(t.minutes)+" depuis "+t.de:""),
      (enConflit?"*** CONFLIT DETECTE ***":"")].filter(Boolean).join(" - ");

    /* le tournoi lui-même */
    L.push("BEGIN:VEVENT");
    L.push("UID:"+e.id+"@creneaux");
    L.push("DTSTAMP:"+now);
    L.push("DTSTART:"+icsDate(x.debut));
    L.push("DTEND:"+icsDate(x.fin));
    L.push(icsPlier("SUMMARY:"+icsEchap((enConflit?"[CONFLIT] ":"")+nomComplet(e))));
    if(e.lieu)L.push(icsPlier("LOCATION:"+icsEchap(e.lieu)));
    L.push(icsPlier("DESCRIPTION:"+icsEchap(desc)));
    if(e.statut==="envisage")L.push("STATUS:TENTATIVE");
    /* rappel au moment de partir : au moins le temps du trajet */
    const avant=t?(t.minutes+marge):60;
    L.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT"+avant+"M");
    L.push(icsPlier("DESCRIPTION:"+icsEchap(t
      ?"Il faut partir maintenant : "+fdur(t.minutes)+" de trajet depuis "+t.de
      :"Tournoi dans 1 h")));
    L.push("END:VALARM");
    L.push("END:VEVENT");

    /* le trajet, comme créneau bloqué à part entière */
    if(t){
      const dep=x.debut-(t.minutes+marge)*60000;
      L.push("BEGIN:VEVENT");
      L.push("UID:"+e.id+"-trajet@creneaux");
      L.push("DTSTAMP:"+now);
      L.push("DTSTART:"+icsDate(dep));
      L.push("DTEND:"+icsDate(x.debut));
      L.push(icsPlier("SUMMARY:"+icsEchap("Trajet vers "+nomComplet(e))));
      L.push(icsPlier("LOCATION:"+icsEchap(t.de+" -> "+t.vers)));
      const detail=itineraireTexte(t);
      L.push(icsPlier("DESCRIPTION:"+icsEchap(
        fdur(t.minutes)+" de trajet, "+fdur(marge)+" de marge."
        +(t.correspondances!=null?" "+t.correspondances+" correspondance(s).":"")
        +(detail?"\n\n"+detail:""))));
      L.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT"+preavis+"M");
      L.push(icsPlier("DESCRIPTION:"+icsEchap("Départ dans "+fdur(preavis)+
        " vers "+t.vers)));
      L.push("END:VALARM");
      L.push("END:VEVENT");
    }
  });

  L.push("END:VCALENDAR");
  return L.join("\r\n")+"\r\n";
}

function exporterICS(){
  const {items}=analyser();
  if(!items.length){alert("Aucun tournoi à exporter.");return}
  const b=new Blob([genererICS()],{type:"text/calendar;charset=utf-8"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u;a.download="tournois.ics";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ---------- notifications quand l'application est ouverte ---------- */
function notifsAutorisees(){
  return typeof Notification!=="undefined"&&Notification.permission==="granted";
}
async function demanderNotifs(){
  if(typeof Notification==="undefined"){
    alert("Ce navigateur ne gère pas les notifications.");return;
  }
  const p=await Notification.requestPermission();
  if(p!=="granted")alert("Notifications refusées. Tu peux réactiver l'autorisation "
    +"dans les réglages du site, ou t'appuyer sur l'export .ics.");
  render();
}
async function montrer(titre,texte){
  try{
    const reg=("serviceWorker" in navigator)?await navigator.serviceWorker.getRegistration():null;
    if(reg&&reg.showNotification)
      await reg.showNotification(titre,{body:texte,icon:"icon-192.png",
        badge:"icon-192.png",tag:titre,requireInteraction:true});
    else new Notification(titre,{body:texte,icon:"icon-192.png"});
  }catch(e){}
}
function verifierAlertes(){
  if(!notifsAutorisees())return;
  const now=Date.now(), vus=new Set(S.notifs);
  let change=false;
  alarmes().forEach(a=>{
    if(vus.has(a.cle))return;
    /* on déclenche dans la fenêtre [échéance, échéance + 20 min] pour rattraper
       une app rouverte peu après, sans réveiller sur un rappel vieux d'hier */
    if(now>=a.quand&&now-a.quand<12e5){
      montrer(a.titre,a.texte);
      S.notifs.push(a.cle);change=true;
    }
  });
  /* purge des rappels dont l'événement est passé */
  const ids=new Set(S.events.map(e=>e.id));
  const avant=S.notifs.length;
  S.notifs=S.notifs.filter(c=>ids.has(c.split(":")[0]));
  if(change||S.notifs.length!==avant)save();
}


/* ---------- synchronisation par Gist GitHub ---------- */
/* Un gist privé contient un seul fichier JSON. Chaque tournoi porte sa date de
   modification, chaque suppression laisse une trace datée : deux appareils
   modifiés hors ligne se réconcilient sans qu'aucun n'écrase l'autre. */

const FICHIER_GIST="creneaux.json";

async function gistAppel(url,opt){
  const o=Object.assign({headers:{
    "Authorization":"Bearer "+sync.token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"}},opt||{});
  const r=await fetch(url,o);
  if(r.status===401)throw new Error("jeton refusé — vérifie qu'il est de type « classic » avec la case gist cochée");
  if(r.status===403)throw new Error("accès interdit — la portée gist manque au jeton");
  if(r.status===404)throw new Error("gist introuvable — l'identifiant est erroné ou le jeton n'y a pas accès");
  if(!r.ok)throw new Error("GitHub a répondu "+r.status);
  return r.json();
}

async function gistLire(){
  const g=await gistAppel("https://api.github.com/gists/"+sync.gistId);
  const f=g.files&&g.files[FICHIER_GIST];
  if(!f)throw new Error("le gist ne contient pas "+FICHIER_GIST);
  if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url);return r.json()}
  return JSON.parse(f.content);
}

function chargeUtile(){
  return{v:1,maj:Date.now(),events:S.events,lieux:S.lieux,exclus:S.exclus,
    trajets:S.trajets,tc:S.tc,
    supprimes:S.supprimes,reglages:S.reglages,reglagesMaj:S.reglagesMaj||0};
}

async function gistEcrire(){
  const contenu=JSON.stringify(chargeUtile(),null,1);
  const fichiers={};fichiers[FICHIER_GIST]={content:contenu};
  if(sync.gistId){
    await gistAppel("https://api.github.com/gists/"+sync.gistId,
      {method:"PATCH",body:JSON.stringify({files:fichiers})});
  }else{
    const g=await gistAppel("https://api.github.com/gists",{method:"POST",
      body:JSON.stringify({description:"Créneaux — agenda de tournois",
        public:false,files:fichiers})});
    sync.gistId=g.id;saveSync();
  }
}

/* Fusion : pour chaque tournoi on garde la version la plus récemment modifiée ;
   une suppression l'emporte si elle est postérieure à la dernière modification. */
function fusionner(dist){
  const parId={};
  (dist.events||[]).forEach(e=>{parId[e.id]=e});
  S.events.forEach(e=>{
    const d=parId[e.id];
    if(!d||(e.maj||0)>=(d.maj||0))parId[e.id]=e;
  });

  /* mêmes règles pour les lieux favoris : version la plus récente, suppression datée */
  const lieuxId={};
  (dist.lieux||[]).forEach(l=>{lieuxId[l.id]=l});
  (S.lieux||[]).forEach(l=>{
    const d=lieuxId[l.id];
    if(!d||(l.maj||0)>=(d.maj||0))lieuxId[l.id]=l;
  });

  const supp=Object.assign({},dist.supprimes||{});
  Object.keys(S.supprimes||{}).forEach(id=>{
    supp[id]=Math.max(supp[id]||0,S.supprimes[id]);
  });

  const restants=[];
  Object.keys(parId).forEach(id=>{
    const e=parId[id];
    if(supp[id]&&supp[id]>=(e.maj||0))return;   // suppression postérieure : on écarte
    if(supp[id])delete supp[id];                // modification postérieure : la trace tombe
    restants.push(e);
  });
  S.events=restants;

  const exId={};
  (dist.exclus||[]).forEach(x=>{exId[x.id]=x});
  (S.exclus||[]).forEach(x=>{
    const d2=exId[x.id];
    if(!d2||(x.maj||0)>=(d2.maj||0))exId[x.id]=x;
  });
  S.exclus=Object.keys(exId).map(id=>exId[id])
    .filter(x=>!(supp[x.id]&&supp[x.id]>=(x.maj||0)));

  S.lieux=Object.keys(lieuxId).map(id=>lieuxId[id])
    .filter(l=>!(supp[l.id]&&supp[l.id]>=(l.maj||0)))
    .sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr"));

  /* purge des traces de plus de 90 jours */
  const limite=Date.now()-90*864e5;
  Object.keys(supp).forEach(id=>{if(supp[id]<limite)delete supp[id]});
  S.supprimes=supp;

  /* trajets : une valeur saisie à la main l'emporte toujours */
  const tr=Object.assign({},dist.trajets||{});
  Object.keys(S.trajets).forEach(k=>{
    const l=S.trajets[k], d=tr[k];
    if(!d||l.source==="manuel"||d.source!=="manuel")tr[k]=l;
  });
  S.trajets=tr;
  S.tc=Object.assign({},dist.tc||{},S.tc||{});

  if((dist.reglagesMaj||0)>(S.reglagesMaj||0)){
    S.reglages=Object.assign({},REGLAGES_DEFAUT,dist.reglages||{});
    S.reglagesMaj=dist.reglagesMaj;
  }
}

/* ---------- import par collage ---------- */
/* Le navigateur ne peut pas lire melee.gg directement (blocage CORS), mais le
   texte copié depuis la page arrive intact. On l'analyse ici, en tolérant les
   formats français et anglais, puis on pré-remplit le formulaire : l'utilisateur
   garde toujours le dernier mot sur ce qui est retenu. */

const MOIS_FR={janvier:1,"février":2,fevrier:2,mars:3,avril:4,mai:5,juin:6,
  juillet:7,"août":8,aout:8,septembre:9,octobre:10,novembre:11,"décembre":12,decembre:12};
const MOIS_EN={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,
  september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,
  jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};

function isoDate(a,m,j){return a+"-"+pad(m)+"-"+pad(j)}

function extraireDate(t){
  let m;
  if((m=t.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/)))
    return isoDate(+m[1],+m[2],+m[3]);
  if((m=t.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d{2})\b/))){
    /* 12/09 est ambigu : jj/mm en France, mm/jj aux États-Unis. On tranche par
       la valeur quand c'est possible, on retient la convention française sinon
       et on le signale à l'utilisateur. */
    const x=+m[1], y=+m[2];
    if(x>12)return isoDate(+m[3],y,x);
    if(y>12)return isoDate(+m[3],x,y);
    extraireDate.ambigu=true;
    return isoDate(+m[3],y,x);
  }
  if((m=t.match(/\b(\d{1,2})\s+([A-Za-zÀ-ÿ]+)\.?\s+(20\d{2})\b/))){
    const c=m[2].toLowerCase(), n=MOIS_FR[c]||MOIS_EN[c];
    if(n)return isoDate(+m[3],n,+m[1]);
  }
  if((m=t.match(/\b([A-Za-z]+)\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d{2})\b/))){
    const n=MOIS_EN[m[1].toLowerCase()];
    if(n)return isoDate(+m[3],n,+m[2]);
  }
  return null;
}

function extraireHeure(t){
  let m;
  /* 1. L'heure accolée à une date est le champ officiel : elle prime sur toute
        heure mentionnée dans un titre. */
  if((m=t.match(/\b\d{1,2}[\/.]\d{1,2}[\/.]20\d{2}\s+(\d{1,2}):(\d{2})\b/)))
    return pad(Math.min(23,+m[1]))+":"+m[2];

  /* 2. AM/PM avant le format 24 h, sinon « 1:00 PM » serait lu 01:00. */
  if((m=t.match(/\b(\d{1,2})(?::(\d{2}))?\s*([APap])\.?\s?[Mm]\.?\b/))){
    let h=+m[1]%12;
    if(/[Pp]/.test(m[3]))h+=12;
    return pad(h)+":"+pad(m[2]?+m[2]:0);
  }

  /* 3. hh:mm */
  if((m=t.match(/\b(\d{1,2}):(\d{2})\b/)))
    return pad(Math.min(23,+m[1]))+":"+pad(Math.min(59,+m[2]));

  /* 4. Notation française. Le « h » doit être collé aux minutes (10h30) ou
        entouré d'espaces des deux côtés (10 h 30). Sans cette rigueur,
        « à 10h 12/09 » se lisait 10:12 — les minutes venaient du quantième. */
  if((m=t.match(/\b(\d{1,2})h([0-5]\d)\b/))||(m=t.match(/\b(\d{1,2})\s+h\s+([0-5]\d)\b/)))
    return pad(Math.min(23,+m[1]))+":"+m[2];

  /* 5. Heure ronde : « à 10h », sans minutes à sa suite. */
  if((m=t.match(/\b(\d{1,2})\s?h\b(?!\s*[0-5]\d)/)))
    return pad(Math.min(23,+m[1]))+":00";

  return null;
}

function analyserColle(txt){
  extraireDate.ambigu=false;
  const brut=deplierLiens(txt).map(x=>x.texte).join("\n");
  const lignes=brut.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const r={trouve:[],manque:[]};

  const mu=brut.match(/https?:\/\/(?:www\.)?melee\.gg\/[^\s"'<>]+/i);
  if(mu){r.url=mu[0].replace(/[.,;:)\]]+$/,"");r.trouve.push("lien Melee")}

  const d=extraireDate(brut);
  if(d){
    r.date=d;
    r.trouve.push("date");
    if(extraireDate.ambigu)r.avertissement="Date au format numérique, ambiguë entre "
      +"jour/mois et mois/jour : j'ai retenu la convention française. Vérifie-la.";
  }else r.manque.push("date");

  const h=extraireHeure(brut);
  if(h){r.heure=h;r.trouve.push("heure")}else r.manque.push("heure");

  /* nom : première ligne substantielle qui ne soit ni une URL ni une date seule */
  const cand=lignes.find(l=>l.length>3&&l.length<120&&!/^https?:/i.test(l)
    &&!/^\d{1,2}[\/:.h]/.test(l)&&!/^(date|heure|time|when|location|lieu)\s*:/i.test(l));
  if(cand){r.nom=cand;r.trouve.push("nom")}else r.manque.push("nom");

  /* adresse : une ligne portant un code postal à 5 chiffres */
  const adr=lignes.find(l=>/\b\d{5}\b/.test(l)&&l.length<160&&!/^https?:/i.test(l));
  if(adr){r.lieu=adr;r.trouve.push("adresse")}else r.manque.push("adresse");

  const mf=brut.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|EUR\b)/i)
        ||brut.match(/(?:entry\s*fee|frais|tarif|prix)\s*:?\s*(\d+(?:[.,]\d{1,2})?)/i);
  if(mf){r.frais=String(Math.round(parseFloat(mf[1].replace(",","."))));r.trouve.push("frais")}

  const mj=brut.match(/(\d{1,4})\s*(?:joueurs?|players?|participants?)/i);
  if(mj){r.participants=mj[1];r.trouve.push("participants")}

  if(/\b(sealed|scell[ée]|draft|limited|limit[ée])\b/i.test(brut)){
    r.drafts=true;r.format="Limité";r.trouve.push("format limité");
  }else if(/\b(constructed|construit|standard|premier)\b/i.test(brut)){
    r.format="Construit";r.trouve.push("format construit");
  }
  if(/\bcyberpunk\b/i.test(brut)&&JEUX.indexOf("Cyberpunk")>=0){
    r.jeu="Cyberpunk";r.trouve.push("jeu");
  }
  if(/\bbo3|best[- ]of[- ]?3\b/i.test(brut))r.bo="bo3";
  else if(/\bbo1|best[- ]of[- ]?1\b/i.test(brut))r.bo="bo1";

  return r;
}

/* Rapproche l'adresse importée d'une boutique déjà enregistrée. */
function lieuCorrespondant(adresse,nom){
  const a=norm(adresse), n=norm(nom||"");
  return (S.lieux||[]).find(l=>{
    const la=norm(l.adresse), ln=norm(l.nom);
    return (la&&a&&(a.indexOf(la)>=0||la.indexOf(a)>=0))
        || (ln&&n&&n.indexOf(ln)>=0);
  })||null;
}

  if(formOuvert)h+=formHTML();
  if(panneau)h+=(S.reglages.mode==="transports"?trajetsTCHTML():trajetsHTML(paires));

    +'<span><i class="pastille" style="background:var(--conflit)"></i> conflit</span>'
    +'<span><i class="pastille" style="background:repeating-linear-gradient(45deg,var(--trajet) 0 3px,transparent 3px 6px)"></i> trajet</span>'

          +'" data-a="fj" data-v="'+esc(j)+'">'+esc(j)+'</button>').join("")+'</div>';
    }
    if(lieuxDispo.length>1){
      h+='<div class="fl"><span class="fl-t">Lieu</span>'
        +'<button class="puce'+(filtreLieu?"":" on")+'" data-a="fx" data-v="">Tous</button>'

function jourHTML(date,items,conflits){
  const mins=items.map(x=>{const d=new Date(x.debut);return d.getHours()*60+d.getMinutes()});
  const fins=items.map((x,i)=>mins[i]+x.duree);
  const bmin=Math.max(0,Math.min(420,...mins)-30);
  const bmax=Math.min(1440,Math.max(1380,...fins)+30);
  const span=bmax-bmin;
  const pct=m=>((m-bmin)/span)*100;

  let h='<div class="jour"><div class="jour-t">'+libJour(date)+'</div><div class="piste">';
  for(let hh=Math.ceil(bmin/60);hh*60<=bmax;hh+=2)
    h+='<div class="heure" style="left:'+pct(hh*60)+'%"><span>'+pad(hh)+'h</span></div>';
  items.forEach((x,i)=>{
    const enC=conflits.has(x.ev.id);
    const c=enC?"conflit":(x.ev.statut==="envisage"?"envisage":"");
    /* le segment porte la couleur du statut : sans cela il reprenait l'accent
       général, entrant en concurrence visuelle avec le code des statuts */
    const teinte=(enC||x.ev.statut==="envisage")?""
      :"background:"+((STATUTS[x.ev.statut]||{}).c||"var(--st-inscrit)")+";";
    h+='<div class="seg '+c+'" style="'+teinte+'left:'+pct(mins[i])+'%;width:'+Math.max(1.5,(x.duree/span)*100)
      +'%" title="'+esc(nomComplet(x.ev))+' — '+hhmm(mins[i])+' à '+hhmm(fins[i])+'">'
      +esc(nomComplet(x.ev))+'</div>';
  });
  const tous=analyser().items;
  items.forEach((x,i)=>{
    const gi=tous.findIndex(y=>y.ev.id===x.ev.id);
    const t=trajetEntrant(tous,gi);
    if(!t)return;
    const dep=mins[i]-t.minutes;
    const gauche=Math.max(bmin,dep);
    h+='<div class="seg-trajet" style="left:'+pct(gauche)+'%;width:'
      +Math.max(0.5,((mins[i]-gauche)/span)*100)
      +'%" title="Trajet '+fdur(t.minutes)+' depuis '+esc(t.de)+'"></div>';
  });
  h+='</div>';

function apercuConflits(duree){
  if(!draft.date||!draft.heure)return[];
  const deb=horod(draft), fin=deb+duree*60000, out=[];
  const {items}=analyser();
  items.forEach(a=>{
    if(a.ev.id===draft.id)return;
    if(deb<a.fin&&a.debut<fin){out.push('chevauche « '+esc(a.ev.nom||"sans nom")+' »');return}
    const ec=deb>a.fin?(deb-a.fin)/60000:(a.debut-fin)/60000;
    if(ec>840)return;
    if(norm(draft.lieu)===norm(a.ev.lieu))return;
    const t=S.trajets[cleTr(draft.lieu,a.ev.lieu)];
    if(t&&ec<t.minutes)out.push('laisse '+fdur(Math.round(ec))+' avant « '
      +esc(a.ev.nom||"sans nom")+' » alors que le trajet dure '+fdur(t.minutes));
  });
  return out;
}






/* ---------- lecture du tableau « Tous les tournois » de Melee ---------- */
/* Melee sert un vrai tableau à colonnes séparées par des tabulations :
   date+heure+fuseau | nom | jeu | organisateur | statut | joueurs | inscription |
   type | frais. C'est bien plus fiable que d'analyser du texte libre : on cible
   ces lignes et on ignore tout le reste de la page (menus, cartes, pied de page). */

const JEUX_MELEE={
  "cyberpunk tcg":"Cyberpunk","cyberpunktcg":"Cyberpunk","cyberpunk":"Cyberpunk","palworld":"Palworld","riftbound":"Riftbound",
  "one piece":"One Piece","pokemon":"Pokémon","pokémon":"Pokémon",
  "jce altered":"Altered","altered":"Altered","flesh and blood":"Flesh and Blood"
};

function jeuMelee(libelle){
  const n=norm(libelle);
  if(JEUX_MELEE[n])return JEUX_MELEE[n];
  const direct=JEUX.find(j=>norm(j)===n);
  if(direct)return direct;
  const partiel=JEUX.find(j=>j!=="Autre"&&(n.indexOf(norm(j))>=0||norm(j).indexOf(n)>=0));
  return partiel||"Autre";
}

/* « 12/09/2026 14:30 CEST » — toujours jj/mm/aaaa sur l'interface française */
function dateHeureMelee(c){
  const m=String(c||"").match(/(\d{1,2})\/(\d{1,2})\/(20\d{2})\s+(\d{1,2}):(\d{2})\s*([A-Z]{2,4})?/);
  if(!m)return null;
  return{date:m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]),heure:pad(+m[4])+":"+m[5],
         fuseau:m[6]||""};
}

function analyserTableau(txt){
  const out=[];
  deplierLiens(txt).forEach(o=>{
    const l=o.texte;
    if(l.indexOf("\t")<0)return;
    const c=l.split("\t").map(v=>v.trim());
    if(c.length<6)return;
    const dh=dateHeureMelee(c[0]);
    if(!dh)return;                       /* écarte l'en-tête et tout le décor */

    const e=Object.assign({},VIDE,dh);
    e.nom=c[1]||"Sans nom";
    e.jeu=jeuMelee(c[2]||"");
    e.organisateur=c[3]||"";
    e.statutMelee=c[4]||"";

    const mj=(c[5]||"").match(/(\d+)\s*(?:of|sur|\/)\s*(\d+)/i);
    if(mj){e.participants=mj[2];e.inscrits=mj[1]}   /* la capacité, pas l'affluence */

    const frais=c[7]||c[8]||"";
    if(/gratuit|free/i.test(frais))e.frais="0";
    else{
      const mf=frais.match(/(\d+(?:[.,]\d{1,2})?)/);
      if(mf)e.frais=String(Math.round(parseFloat(mf[1].replace(",","."))));
    }

    if(o.url)e.url=o.url;

    const l2=lieuCorrespondant(e.organisateur,e.organisateur);
    if(l2){e.lieuId=l2.id;e.lieu=l2.adresse;e.lieuNom=l2.nom}
    else e.lieuNom=e.organisateur;

    out.push(e);
  });
  return out;
}



/* Certains collages arrivent avec les liens au format [texte](url) selon le
   navigateur ou l'outil employé. On rend le texte à sa forme nue avant toute
   analyse — et on en profite pour récupérer l'adresse du tournoi. */
const RE_MD=/\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g;

function deplierLiens(txt){
  const lignes=String(txt||"").split(/\r?\n/);
  return lignes.map(l=>{
    let url="";
    const nu=l.replace(RE_MD,(_,texte,adresse)=>{
      if(!url&&/\/Tournament\/View\//i.test(adresse))url=adresse;
      return texte;
    });
    return{texte:nu,url:url};
  });
}

/* ---------- contrôle de vraisemblance des dates ---------- */
/* Deux témoins indépendants permettent de repérer une saisie erronée par la
   boutique : le titre du tournoi, qui porte presque toujours sa date, et le
   fuseau affiché — CEST court de fin mars à fin octobre, CET le reste de
   l'année. Une contradiction ne prouve rien, mais mérite un coup d'œil. */

const MOIS_TITRE=Object.assign({},MOIS_FR);

function dateDansTitre(titre,annee){
  const t=String(titre||"");
  let m;
  /* jj/mm éventuellement suivi de l'année, comme « - 15/09/26 - » */
  if((m=t.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/))){
    const j=+m[1], mo=+m[2];
    if(j>=1&&j<=31&&mo>=1&&mo<=12)return{jour:j,mois:mo};
  }
  /* « Dimanche 13 Septembre » */
  if((m=t.match(/\b(\d{1,2})\s+([A-Za-zÀ-ÿ]+)/))){
    const n=MOIS_TITRE[m[2].toLowerCase()];
    if(n)return{jour:+m[1],mois:n};
  }
  return null;
}

function verifierDate(e){
  if(!e.date)return null;
  const[a,mo,j]=e.date.split("-").map(Number);

  const t=dateDansTitre(e.nom,a);
  if(t&&(t.jour!==j||t.mois!==mo)){
    return "le titre annonce le "+pad(t.jour)+"/"+pad(t.mois)
      +" alors que la fiche indique le "+pad(j)+"/"+pad(mo);
  }

  const fz=(e.fuseau||"").toUpperCase();
  if(fz==="CEST"&&(mo<4||mo>10))
    return "fuseau CEST (heure d'été) annoncé pour un mois d'hiver";
  if(fz==="CET"&&(mo>4&&mo<10))
    return "fuseau CET (heure d'hiver) annoncé pour un mois d'été";

  return null;
}

/* ---------- lecture des cartes « Trouver des événements » ---------- */
/* Autre présentation, autres repères : pas de tabulations mais des cartes
   groupées par boutique. Trois ancres régulières suffisent —
   la ligne de date, la ligne « NN km • Ville » qui ouvre chaque groupe,
   et la ligne « prix • N Joueurs inscrits » qui suit l'organisateur. */

const RE_DATE_MELEE=/^\s*(\d{1,2})\/(\d{1,2})\/(20\d{2})\s+(\d{1,2}):(\d{2})\s*(CES?T|CET|UTC|[A-Z]{2,4})?\s*$/;
const RE_DISTANCE=/^\s*(\d+(?:[.,]\d+)?)\s*(km|mi)\s*•\s*(.+)$/i;
const RE_PRIX=/^\s*(Free|Gratuit|[$€£]\s?\d+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?\s*[€$])\s*•\s*(\d+)\s*(?:Joueurs?|Players?)/i;

function analyserCartes(txt){
  const brut=deplierLiens(txt);
  const L=brut.map(x=>x.texte.replace(/\s+$/,""));
  const U=brut.map(x=>x.url);
  const out=[];
  let distance=null, ville="", groupe="";

  L.forEach((ligne,i)=>{
    const md=ligne.match(RE_DISTANCE);
    if(md){
      distance=parseFloat(md[1].replace(",","."));
      if(/mi/i.test(md[2]))distance=Math.round(distance*1.609);
      ville=md[3].trim();
      /* le nom de la boutique précède la ligne de distance */
      groupe=(L[i-1]||"").trim();
      return;
    }

    const m=ligne.match(RE_DATE_MELEE);
    if(!m)return;

    const e=Object.assign({},VIDE);
    e.date=m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
    e.heure=pad(+m[4])+":"+m[5];
    e.fuseau=m[6]||"";
    /* Le titre suit la date dans les deux présentations rencontrées : répété
       après elle en texte brut, placé après elle seulement quand les liens sont
       conservés. On privilégie donc la ligne suivante, et on ne retombe sur la
       précédente que si elle n'est pas exploitable. */
    const utilisable=v=>{
      const x=(v||"").trim();
      return x&&x.length<160&&!RE_DATE_MELEE.test(x)&&!RE_DISTANCE.test(x)
        &&!RE_PRIX.test(x)&&!/^(voir la boutique|view (the )?store|tabletop)$/i.test(x);
    };
    e.nom=(utilisable(L[i+1])?L[i+1]:(utilisable(L[i-1])?L[i-1]:"Sans nom")).trim();
    e.url=U[i]||U[i+1]||U[i-1]||"";
    e.distanceKm=distance;
    e.ville=ville;
    /* Melee distingue le lieu (en-tête de groupe) de l'organisateur : une même
       boutique peut être exploitée par une société au nom différent. On garde
       les deux, le rapprochement essaiera l'un et l'autre. */
    e.boutique=groupe;

    /* on avance jusqu'à la ligne de prix : l'organisateur la précède */
    for(let k=i+1;k<Math.min(i+8,L.length);k++){
      const mp=(L[k]||"").match(RE_PRIX);
      if(!mp)continue;
      e.organisateur=(L[k-1]||"").trim()||groupe;
      e.inscrits=mp[2];
      if(/free|gratuit/i.test(mp[1]))e.frais="0";
      else{
        const mf=mp[1].match(/(\d+(?:[.,]\d{1,2})?)/);
        if(mf)e.frais=String(Math.round(parseFloat(mf[1].replace(",","."))));
      }
      /* les étiquettes qui suivent portent le jeu */
      for(let z=k+1;z<Math.min(k+6,L.length);z++){
        const t=(L[z]||"").trim();
        if(!t||RE_DATE_MELEE.test(t)||RE_DISTANCE.test(t))break;
        const j=jeuMelee(t.replace(/tcg$/i,"").trim());
        if(j!=="Autre"){e.jeu=j;break}
      }
      break;
    }
    if(!e.organisateur)e.organisateur=groupe;

    const l2=lieuCorrespondant(e.boutique,e.boutique)
      ||lieuCorrespondant(e.organisateur,e.organisateur);
    if(l2){e.lieuId=l2.id;e.lieu=l2.adresse;e.lieuNom=l2.nom}
    else{e.lieuNom=e.boutique||e.organisateur;e.lieu=ville||""}

    out.push(e);
  });
  return out;
}

/* Découpe un collage contenant plusieurs événements. Le repère fiable est la
   date : chaque tournoi en porte exactement une, et son nom la précède. On
   ouvre donc un nouveau bloc dès qu'une date apparaît alors que le bloc courant
   en contient déjà une. */
function decouperBlocs(txt){
  const lignes=deplierLiens(txt).map(x=>x.texte.trim()).filter(Boolean);
  const dates=[];
  lignes.forEach((l,i)=>{if(extraireDate(l))dates.push(i)});
  if(!dates.length)return [];

  /* Le nom du tournoi précède sa date : on fait donc démarrer chaque bloc à la
     ligne qui précède la date, et non à la date elle-même. */
  const debuts=dates.map(i=>{
    const p=i-1;
    return (p>=0&&!extraireDate(lignes[p]))?p:i;
  });

  /* L'en-tête de page (nom et adresse de la boutique) précède le premier bloc :
     il vaut pour tous, on le rattache à chacun — en fin de bloc, pour ne pas
     perturber la détection du nom. */
  const preambule=lignes.slice(0,debuts[0]).join("\n");

  return debuts.map((d,k)=>{
    const fin=(k+1<debuts.length)?debuts[k+1]:lignes.length;
    const corps=lignes.slice(d,fin).join("\n");
    return preambule?corps+"\n"+preambule:corps;
  }).filter(b=>extraireDate(b));
}

/* Analyse un collage multi-événements et confronte chaque entrée au planning. */
function analyserListe(txt){
  /* trois présentations possibles, du plus structuré au plus libre :
     le tableau « Tous les tournois », les cartes « Trouver des événements »,
     puis le texte libre en dernier recours. */
  let tab=analyserTableau(txt);
  if(!tab.length)tab=analyserCartes(txt);
  if(tab.length){
    return tab.map(e=>{
      /* repéré sur Melee n'est pas inscrit : le statut se relève à la main */
      e.statut="envisage";
      const ds=doublons(e);
      return{ev:e,rapport:{trouve:[],manque:[]},connu:ds.length>0,doubles:ds,
             passe:horod(e)<Date.now(),termine:/termin/i.test(e.statutMelee||""),
             exclu:estExclu(e),suspect:verifierDate(e)};
    });
  }
  return decouperBlocs(txt).map(b=>{
    const r=analyserColle(b);
    const d=Object.assign({},VIDE);
    ["nom","date","heure","lieu","frais","participants","format","jeu","bo","url"]
      .forEach(k=>{if(r[k]!==undefined&&r[k]!=="")d[k]=r[k]});
    if(r.drafts)d.drafts=true;
    const l=lieuCorrespondant(r.lieu||"",b);
    if(l){d.lieuId=l.id;d.lieu=l.adresse;d.lieuNom=l.nom}
    const ds=doublons(d);
    return{ev:d,rapport:r,connu:ds.length>0,doubles:ds};
  });
}

function trajetsTCHTML(){
  const {items}=analyser();
  let h='<div class="trajets"><div class="eyebrow" style="margin-bottom:12px">'
    +'Déplacements en transports</div>';
  const lignes=[];
  items.forEach((x,i)=>{
    const de=origineDe(items,i), vers=x.ev.lieu;
    if(!de||norm(de)===norm(vers))return;
    const tc=S.tc[x.ev.id];
    const valide=tc&&tc.empreinte===empreinteTC(de,vers,x.ev);
    let droite;
    if(valide){
      const dep=tc.depart?tc.depart.slice(9,11)+":"+tc.depart.slice(11,13):null;
      droite='<span class="tr-v">'+fdur(tc.minutes)
        +(tc.correspondances!=null?" · "+tc.correspondances+" corresp.":"")
        +(dep?" · départ "+dep:"")+'</span>'
        +'<input type="number" min="0" step="5" value="'+tc.minutes
        +'" data-tc="'+esc(x.ev.id)+'" aria-label="Minutes de trajet">';
    }else if(tc){
      droite='<span style="color:var(--conflit);font-size:12px">à recalculer '
        +'(lieu ou horaire modifié)</span>';
    }else{
      droite='<span style="color:var(--craie-dim);font-size:12px">non calculé</span>';
    }
    lignes.push('<div class="tr-l"><div class="tr-n">'+esc(nomComplet(x.ev))
      +'<br><span style="color:var(--craie-dim);font-size:11.5px">'+esc(de)
      +' <span style="color:var(--feutre3)">→</span> '+esc(vers)
      +(valide&&tc.lignes&&tc.lignes.length?' · '+esc(tc.lignes.join(" › ")):'')
      +'</span></div>'+droite+'</div>');
  });
  if(!lignes.length){
    h+='<div style="color:var(--craie-dim);font-size:13px">Aucun déplacement à '
      +'calculer. Renseigne une adresse de départ dans le panneau Rappels, et '
      +'des lieux précis sur tes tournois.</div>';
  }else{
    h+=lignes.join("");
    h+='<button style="margin-top:14px" data-a="calctc"'+(occupe?" disabled":"")+'>'
      +(occupe?"Calcul en cours…":"Calculer les trajets en transports")+'</button>';
    h+='<div class="note">Chaque itinéraire est calculé pour <b>arriver avant</b> '
      +'le début du tournoi, à la date et à l\'heure réelles — un dimanche matin '
      +'ne donne pas le même résultat qu\'un mardi. Il est automatiquement marqué '
      +'à recalculer si tu modifies le lieu, la date ou l\'heure.</div>';
  }
  return h+'</div>';
}

/* ---------- interactions ---------- */
function brancher(){
  document.querySelectorAll("[data-a]").forEach(b=>{
    const a=b.dataset.a;
    if(a==="excl-add"){
      b.addEventListener("click",()=>{
        const x=importListe&&importListe[b.dataset.i];
        if(!x)return;
        exclure(x.ev);
        delete importSel[b.dataset.i];
        importListe.forEach(y=>{y.exclu=estExclu(y.ev)});
        save();render();syncDifferee();
      });
      return;
    }
    if(a==="statut"){
      b.addEventListener("click",ev=>{
        ev.stopPropagation();          /* sinon l'en-tête se replierait aussi */
        const e=S.events.find(x=>x.id===b.dataset.id);
        if(e&&e.statut!==b.dataset.v){
          e.statut=b.dataset.v;e.maj=Date.now();
          save();render();syncDifferee();
        }
      });
      return;
    }
    if(a==="fj"||a==="fx"||a==="ij"||a==="itout"||a==="iray"||a==="theme"){
      b.addEventListener("click",()=>{
        if(a==="fj")filtreJeu=b.dataset.v;
        else if(a==="fx")filtreLieu=b.dataset.v;
        else if(a==="itout")importTout=!importTout;
        else if(a==="theme"){
          S.reglages.theme=b.dataset.v;S.reglagesMaj=Date.now();
          save();syncDifferee();appliquerTheme();
        }
        else if(a==="iray"){
          S.reglages.rayonKm=Number(b.dataset.v);S.reglagesMaj=Date.now();
          save();syncDifferee();recocher();
        }
        else{
          const j=b.dataset.v, l=(S.reglages.jeuxSuivis||[]).slice();
          const i=l.indexOf(j);
          if(i>=0)l.splice(i,1);else l.push(j);
          S.reglages.jeuxSuivis=l;S.reglagesMaj=Date.now();
          save();syncDifferee();
          recocher();
        }
        render();
      });
      return;
    }
    b.addEventListener("click",()=>action(a,b.dataset.id));
    if(b.getAttribute("role")==="button"){
      b.addEventListener("keydown",ev=>{
        if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();action(a,b.dataset.id)}
      });
    }
  });
  document.querySelectorAll("[data-f]").forEach(el=>{
    el.addEventListener("input",()=>{
      const k=el.dataset.f;
      let v=el.type==="checkbox"?el.checked:el.value;
      if(k==="dureeManuelle")v=(v===""?null:Number(v));
      draft[k]=v;
      if(k==="lieuId"){
        const l=lieuParId(v);
        if(l){draft.lieu=l.adresse;draft.lieuNom=l.nom}
        else{draft.lieuNom=""}
        render();return;    /* on redessine : adresse et nom viennent de changer */
      }
      const e=document.getElementById("estim");
      if(e)e.innerHTML=estimHTML();
      const b=document.querySelector('[data-a="valider"]');
      if(b)b.disabled=!draft.date||!draft.heure;
    });
  });
  document.querySelectorAll("[data-r]").forEach(el=>{
    el.addEventListener("change",()=>{
      S.reglages[el.dataset.r]=el.value;
      S.reglagesMaj=Date.now();
      save();render();syncDifferee();
    });
  });
  document.querySelectorAll("[data-s]").forEach(el=>{
    el.addEventListener("change",()=>{
      sync[el.dataset.s]=el.value.trim();saveSync();render();
    });
  });
  document.querySelectorAll("[data-imp]").forEach(el=>{
    el.addEventListener("change",()=>{
      const i=el.dataset.imp;
      if(el.checked)importSel[i]=true;else delete importSel[i];
    });
  });
  document.querySelectorAll("[data-l]").forEach(el=>{
    el.addEventListener("input",()=>{
      lieuBrouillon=Object.assign({id:null,nom:"",adresse:""},lieuBrouillon);
      lieuBrouillon[el.dataset.l]=el.value;
    });
  });
  document.querySelectorAll("[data-tc]").forEach(el=>{
    el.addEventListener("change",()=>{
      const id=el.dataset.tc;
      S.tc[id]=Object.assign({},S.tc[id],{minutes:Number(el.value),source:"manuel"});
      save();render();syncDifferee();
    });
  });
  document.querySelectorAll("[data-tr]").forEach(el=>{
    el.addEventListener("change",()=>{
      const k=el.dataset.tr;
      S.trajets[k]=Object.assign({},S.trajets[k],{minutes:Number(el.value),source:"manuel"});
      save();render();
    });
  });
}

/* Ne pré-coche que ce que l'utilisateur suit réellement. Sans jeu suivi
   déclaré, rien n'est coché : mieux vaut cocher deux lignes que d'en décocher
   dix-huit. */
function recocher(){
  importSel={};
  if(!importListe)return;
  const suivis=S.reglages.jeuxSuivis||[];
  if(!suivis.length)return;
  const rayon=Number(S.reglages.rayonKm)||0;
  importListe.forEach((x,i)=>{
    if(x.connu||x.passe||x.termine||x.exclu)return;
    if(suivis.indexOf(x.ev.jeu)<0)return;
    if(rayon&&x.ev.distanceKm!=null&&x.ev.distanceKm>rayon)return;
    importSel[i]=true;
  });
}

function action(a,id){
  if(a==="nouveau"){draft=Object.assign({},VIDE);formOuvert=true;render();window.scrollTo(0,0)}
  else if(a==="editer"){draft=Object.assign({},S.events.find(e=>e.id===id));formOuvert=true;render();window.scrollTo(0,0)}
  else if(a==="annuler"){formOuvert=false;draft=null;render()}
  else if(a==="valider"){
    const ds=doublons(draft);
    if(ds.length){
      const exact=ds.some(d=>d.exact);
      if(!confirm((exact?"Un tournoi identique existe déjà":"Un tournoi très proche existe déjà")
        +" :\n\n"+texteDoublons(ds)
        +"\n\nMême boutique, même jour, horaire voisin. L'ajouter quand même ?"))return;
    }
    draft.maj=Date.now();
    if(draft.id)S.events=S.events.map(e=>e.id===draft.id?draft:e);
    else S.events.push(Object.assign({},draft,{id:"t"+Date.now()}));
    formOuvert=false;draft=null;
    if(!save())alert("Enregistrement impossible : le stockage du navigateur est plein ou bloqué.");
    render();syncDifferee();
  }
  else if(a==="suppr"){
    if(confirm("Retirer ce tournoi du planning ?")){
      S.events=S.events.filter(e=>e.id!==id);
      S.supprimes[id]=Date.now();      // trace datée, pour que la suppression se propage
      save();render();syncDifferee();
    }
  }
  else if(a==="panneau"){panneau=!panneau;render()}
  else if(a==="reglages"){reglagesOuvert=!reglagesOuvert;render()}
  else if(a==="lieux"){lieuxOuvert=!lieuxOuvert;if(!lieuxOuvert)lieuBrouillon=null;render()}
  else if(a==="import-melee"){importOuvert=!importOuvert;render()}
  else if(a==="passes"){voirPasses=!voirPasses;render()}
  else if(a==="plier"){
    if(ouverts[id])delete ouverts[id];else ouverts[id]=true;
    render();
  }
  else if(a==="imp-vider"){importTexte="";importRapport=null;importListe=null;importSel={};importTout=false;render()}
  else if(a==="excl-del"){
    reintegrer(id);
    if(importListe)importListe.forEach(x=>{x.exclu=estExclu(x.ev)});
    save();render();syncDifferee();
  }
  else if(a==="imp-tout"){
    const suivis=S.reglages.jeuxSuivis||[];
    importListe.forEach((x,i)=>{
      if(x.connu||x.passe||x.termine||x.exclu)return;
      if(suivis.length&&!importTout&&suivis.indexOf(x.ev.jeu)<0)return;
      importSel[i]=true;
    });
    render();
  }
  else if(a==="imp-rien"){importSel={};render()}
  else if(a==="imp-ajouter"){
    const choisis=importListe.filter((x,i)=>importSel[i]&&!x.connu&&!x.passe&&!x.termine&&!x.exclu);
    if(!choisis.length){alert("Coche au moins un événement à ajouter.");return}
    const t=Date.now();
    choisis.forEach((x,n)=>{
      /* un tournoi repéré sur Melee n'est pas un tournoi auquel on est inscrit */
      S.events.push(Object.assign({},x.ev,{id:"t"+(t+n),maj:t+n,statut:"envisage"}));
    });
    importListe=null;importSel={};importTout=false;importTexte="";importRapport=null;importOuvert=false;
    save();render();syncDifferee();
    alert(choisis.length+" tournoi"+(choisis.length>1?"s ajoutés":" ajouté")
      +" au planning. Vérifie les durées : faute de capacité annoncée par Melee, "
      +"elles reposent sur 16 joueurs en Bo3 sans top cut.");
  }
  else if(a==="imp-run"){
    const z=document.getElementById("imp");
    importTexte=z?z.value:"";
    if(!importTexte.trim()){alert("Colle d'abord le contenu de la page Melee.");return}

    /* plusieurs événements : on bascule en mode liste et confrontation */
    const liste=analyserListe(importTexte);
    if(liste.length>1){
      importListe=liste;importRapport=null;importTout=false;
      recocher();
      render();return;
    }
    importListe=null;
    const r=analyserColle(importTexte);
    importRapport=r;
    const d=Object.assign({},VIDE);
    ["nom","date","heure","lieu","frais","participants","format","jeu","bo","url"]
      .forEach(k=>{if(r[k]!==undefined&&r[k]!=="")d[k]=r[k]});
    if(r.drafts)d.drafts=true;
    const l=lieuCorrespondant(r.lieu||"",importTexte);
    if(l){d.lieuId=l.id;d.lieu=l.adresse;d.lieuNom=l.nom}
    d.statut="envisage";
    const ds=doublons(d);
    if(ds.length)r.avertissement=(r.avertissement?r.avertissement+" ":"")
      +"Attention : ce tournoi semble déjà enregistré ("+texteDoublons(ds)+").";
    draft=d;formOuvert=true;importOuvert=false;
    render();window.scrollTo(0,0);
  }
  else if(a==="lieu-mod"){lieuBrouillon=Object.assign({},lieuParId(id));render()}
  else if(a==="lieu-annuler"){lieuBrouillon=null;render()}
  else if(a==="lieu-valider"){
    const b=lieuBrouillon||{};
    if(!(b.nom||"").trim()||!(b.adresse||"").trim()){
      alert("Un lieu a besoin d'un nom et d'une adresse.");return;
    }
    b.nom=b.nom.trim();b.adresse=b.adresse.trim();b.maj=Date.now();
    if(b.id){
      S.lieux=S.lieux.map(l=>l.id===b.id?b:l);
      propagerLieu(b);          /* les tournois rattachés suivent l'adresse */
    }else{
      b.id="l"+Date.now();
      S.lieux.push(b);
    }
    S.lieux.sort((x,y)=>(x.nom||"").localeCompare(y.nom||"","fr"));
    lieuBrouillon=null;save();render();syncDifferee();
  }
  else if(a==="lieu-suppr"){
    const l=lieuParId(id);
    const n=S.events.filter(e=>e.lieuId===id).length;
    const msg=n?"Ce lieu est utilisé par "+n+" tournoi"+(n>1?"s":"")
        +". Ils conserveront l'adresse mais perdront le rattachement. Continuer ?"
      :"Retirer « "+(l?l.nom:"")+" » des lieux enregistrés ?";
    if(confirm(msg)){
      S.events.forEach(e=>{if(e.lieuId===id){e.lieuId="";e.maj=Date.now()}});
      S.lieux=S.lieux.filter(x=>x.id!==id);
      S.supprimes[id]=Date.now();
      if(lieuBrouillon&&lieuBrouillon.id===id)lieuBrouillon=null;
      save();render();syncDifferee();
    }
  }
  else if(a==="ics"){exporterICS()}
  else if(a==="notifs"){demanderNotifs()}
  else if(a==="sync"){synchroniser(false)}
  else if(a==="calc"){calculerTrajets()}
  else if(a==="calctc"){calculerTC()}
  else if(a==="export"){
    const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(b), l=document.createElement("a");
    l.href=u;l.download="tournois.json";l.click();URL.revokeObjectURL(u);
  }
  else if(a==="import"){
    const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
    i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);
        if(!d.events)throw new Error("format inattendu");
        fusionner(d);save();render();syncDifferee();
      }catch(e){alert("Import impossible : "+e.message)}};
      r.readAsText(f)};
    i.click();
  }
}

/* ---------- démarrage ---------- */
loadSync();load();appliquerTheme();render();
verifierAlertes();
setInterval(verifierAlertes,60000);
if(sync.token&&sync.gistId)synchroniser(true);
/* on retente un échange au retour de l'application au premier plan */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){verifierAlertes();if(sync.token&&sync.gistId)synchroniser(true)}
});
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
